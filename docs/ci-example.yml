name: reporting-db-migrations

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - run: go mod tidy
      - run: gofmt -w .
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o reporting-migrator ./cmd/reporting-migrator
