# MSSQL for local integration tests
# Usage:
#   docker compose up -d          # start
#   docker compose down -v        # stop + clean volumes
#   docker compose logs -f        # follow logs
#
# Connection: sqlserver://sa:yourStrong(!)Password@localhost:1433/dactests
#
# Run tests: RMIG_RUN_SQLSERVER_INTEGRATION=1 \
#            RM_DB_SERVER=localhost RM_DB_DATABASE=dactests \
#            RM_DB_USER=sa RM_DB_PASSWORD='yourStrong(!)Password' \
#            RM_DB_ENCRYPT=false RM_DB_TRUST_SERVER_CERTIFICATE=true \
#            cargo test -p migrator-core --test integration_plan -- --nocapture

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-yourStrong(!)Password}"
      MSSQL_PID: Developer
      MSSQL_LCK_MEMORY_CLERK_ENABLED: "0"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      # Loopback only: a dev SQL Server with a repository-known SA password
      # must never listen on every interface. Override the host port for
      # parallel stacks (worktrees/CI) via MSSQL_HOST_PORT.
      - "127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # $$ escapes compose interpolation: the CONTAINER env var is expanded at
      # probe time, so an overridden MSSQL_SA_PASSWORD authenticates too.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mssql_data:
