name: Setup
description: Install Rust toolchain

inputs:
  components:
    description: Rustup components to install
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      # Pinned (not @stable) so a new stable release cannot turn CI red on an
      # untouched PR via newly-added clippy lints. Bump deliberately.
      uses: dtolnay/rust-toolchain@c0e9df88980754dd93e5833b8dcb1b304c1fe173 # 1.96.0
      with:
        components: ${{ inputs.components }}
