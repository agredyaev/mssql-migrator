# ---------------------------------------------------------------------------
# build.yml — Compile release-dist binaries.
#
# Responsibility: production build (fat LTO, strip, codegen-units=1).
# Reusable module — called by ci.yml orchestrator.
# ---------------------------------------------------------------------------
name: Build

on:
  workflow_call:

jobs:
  build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Build release-dist binaries
        run: make release-build
