# ---------------------------------------------------------------------------
# build.yml — Compile release-dist binaries and upload as artifacts.
#
# Responsibility: production build (fat LTO, strip, codegen-units=1).
# Reusable module — called by ci.yml orchestrator and release.yml.
# ---------------------------------------------------------------------------
name: Build

on:
  workflow_call:

jobs:
  build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Build release-dist binaries
        run: make release-build

      # upload-artifact zips files and normalizes modes to 0644; tar first so
      # the 0755 executable bits survive download + extraction.
      - name: Archive executables (preserve exec bits)
        run: tar -czf rmig-executables.tar.gz bin/rmig -C target/release-dist rmigd

      - name: Upload executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rmig-executables-${{ runner.os }}
          path: rmig-executables.tar.gz
          if-no-files-found: error
