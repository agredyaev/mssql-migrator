# ---------------------------------------------------------------------------
# release.yml — Version bump, git tag, GitHub Release with binaries.
#
# Responsibility: semver lifecycle only.
# Triggers:
#   - Automatically after CI passes on main (workflow_run)
#   - Manually via workflow_dispatch (major/minor/patch)
# ---------------------------------------------------------------------------
name: Release

on:
  # Auto-release after CI completes successfully on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

  # Manual release via GitHub UI.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# Serialize publishes so two near-simultaneous merges cannot race the version
# bump/tag push (the loser would fail non-fast-forward and drop its release).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Bump & publish release
    runs-on: ubuntu-latest

    # For workflow_run: only run if CI succeeded and it was a push (not PR).
    # For workflow_dispatch: the "Require green CI" step below verifies the
    # dispatched commit has a successful CI run before anything is published.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # Release the exact commit CI validated, not whatever is at branch tip
          # now (a later merge could otherwise be tagged/published untested).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve release state
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_TYPE" != "branch" ]]; then
              echo "ERROR: manual releases must be dispatched from a branch, not $REF_TYPE" >&2
              exit 1
            fi
            case "$REF_NAME" in
              main|master) ;;
              *)
                echo "ERROR: manual releases must be dispatched from main or master, not $REF_NAME" >&2
                exit 1
                ;;
            esac
          fi
          current_tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if git tag --points-at HEAD --list "$current_tag" | grep -qx "$current_tag"; then
            echo "validated_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
            if gh release view "$current_tag" >/dev/null 2>&1; then
              echo "resume=false" >> "$GITHUB_OUTPUT"
            else
              echo "resume=true" >> "$GITHUB_OUTPUT"
              echo "tag=$current_tag" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "resume=false" >> "$GITHUB_OUTPUT"
            echo "validated_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Require green CI for this exact commit (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          VALIDATED_SHA: ${{ steps.release_state.outputs.validated_sha }}
        run: |
          conclusion="$(gh run list --commit "$VALIDATED_SHA" --workflow CI \
            --event push --branch "$RELEASE_BRANCH" --status success \
            --json databaseId --jq 'length')"
          if [ "${conclusion:-0}" -lt 1 ]; then
            echo "ERROR: no successful push CI run recorded for $VALIDATED_SHA on $RELEASE_BRANCH; refusing to publish untested code" >&2
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type
        id: bump_type
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Skip if docs-only change
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Find the latest tag on the current branch
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            
            if [[ -z "$PREV_TAG" ]]; then
              echo "No previous tag found — building first release."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            
            echo "Comparing current HEAD with previous tag: $PREV_TAG"
            CHANGED=$(git diff --name-only "$PREV_TAG" HEAD 2>/dev/null || echo "unknown")
            
            if [[ "$CHANGED" == "unknown" ]]; then
              echo "Error running git diff — falling back to standard behavior (no skip)."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            
            # Print the list of changed files for visibility in logs
            echo "Changed files since $PREV_TAG:"
            echo "$CHANGED"
            
            # Count total changed files and non-code changed files
            TOTAL=$(echo "$CHANGED" | grep -c . || true)
            NON_CODE=$(echo "$CHANGED" | grep -c -E '\.md$|^docs/|^\.github/|^\.gitignore$|^ops/' || true)
            
            echo "Total changed files: $TOTAL"
            echo "Non-code changed files: $NON_CODE"
            
            if [[ "$TOTAL" -eq 0 ]]; then
              echo "No files have changed since the last tag ($PREV_TAG) — skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [[ "$TOTAL" -eq "$NON_CODE" ]]; then
              echo "Only docs/CI/non-code files changed since $PREV_TAG — skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          
          echo "Active code changes detected — proceeding with release."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.filter.outputs.skip != 'true'
        id: version
        run: |
          OLD=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "${{ steps.release_state.outputs.resume }}" != "true" ]]; then
            python3 scripts/bump-version.py "${{ steps.bump_type.outputs.bump }}"
          fi
          NEW=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "old=$OLD"   >> "$GITHUB_OUTPUT"
          echo "new=$NEW"   >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"  >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        if: steps.filter.outputs.skip != 'true'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.filter.outputs.skip != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Build release binaries
        if: steps.filter.outputs.skip != 'true'
        run: make release-build

      - name: Commit, tag & push version bump
        if: steps.filter.outputs.skip != 'true'
        id: pushed
        env:
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [[ "${{ steps.release_state.outputs.resume }}" == "true" ]]; then
            echo "Resuming publication for existing tag ${{ steps.version.outputs.tag }}"
            echo "released_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Stage Cargo.lock too: `make release-build` above re-synced the
          # workspace-member versions, so omitting it leaves the committed lock
          # stale and breaks `cargo install --locked` from the release tag.
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump ${{ steps.version.outputs.old }} → ${{ steps.version.outputs.new }} [skip ci]"
          # Push to the branch that was actually validated (workflow_run) or
          # dispatched — hard-coding main would detach releases from a
          # supported master branch or a manual ref.
          branch="$RELEASE_BRANCH"
          # Idempotence: if a previous partially-failed run already created
          # this tag, do not bump again on rerun — fail with a clear message.
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "ERROR: tag ${{ steps.version.outputs.tag }} already exists; resume/publish that release instead of re-bumping" >&2
            exit 1
          fi
          git tag "${{ steps.version.outputs.tag }}"
          # One atomic push for branch + tag: a failure after the branch push
          # alone would leave a permanent unpublished version on the branch.
          git push --atomic origin "HEAD:refs/heads/${branch}" "refs/tags/${{ steps.version.outputs.tag }}"
          echo "released_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.filter.outputs.skip != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.tag }}"
          body: |
            **Author:** ${{ github.repository_owner }}
            **Version:** `${{ steps.version.outputs.new }}`
            **Bump:** `${{ steps.bump_type.outputs.bump }}`

            Tagged commit: `${{ steps.pushed.outputs.released_sha }}`
            Validated source: `${{ github.event.workflow_run.head_sha || github.sha }}`
          generate_release_notes: true
          files: |
            bin/rmig
            target/release-dist/rmigd
          fail_on_unmatched_files: true
