# ---------------------------------------------------------------------------
# test.yml — Unit tests and SQL Server integration / E2E tests.
#
# Responsibility: cargo test (unit), MSSQL integration plan, full E2E matrix.
# Reusable module — called by ci.yml orchestrator.
# ---------------------------------------------------------------------------
name: Test

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      # `--tests` runs every migrator-core integration binary too (DB-gated ones
      # self-skip without RMIG_RUN_SQLSERVER_INTEGRATION); rmigd's unit tests
      # otherwise never execute anywhere in CI.
      - run: cargo test -p migrator-core --lib --tests
      - run: cargo test -p rmigd

  integration:
    name: Integration & E2E (MSSQL)
    runs-on: ubuntu-latest
    needs: unit
    env:
      RMIGD_SOCKET: ${{ github.workspace }}/.rmig/rmigd-ci.sock
      RMIG_E2E_TIMING_FACTOR: '5.0'
      RMIG_E2E_TIMING_SLACK_MS: '300'
      # The parallel-DB ceiling is not scaled by TIMING_FACTOR; relax it for
      # loaded shared runners. The CLI wall SLO stays at the DOCUMENTED product
      # limit (docs/prod-gate.md: < 150 ms) — a wider CI value would green-light
      # regressions up to 5x the contract.
      RMIG_SLO_MAX_CLI_WALL_MS: '150'
      RMIG_PLAN_DB_MAX_PAR_MS: '2500'
      RMIG_RUN_SQLSERVER_INTEGRATION: '1'
      RMIG_USE_RMIGD: '1'
      RMIG_SESSION_TOKEN: rmig-integration-test-token
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-int-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-int-

      - name: Setup git fixture repository
        run: ./scripts/setup-temp-fixtures.sh

      - name: Start SQL Server
        run: |
          docker compose up -d
          echo "Waiting for MSSQL to be ready..."
          ready=0
          for i in {1..20}; do
            if docker compose exec -T mssql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "yourStrong(!)Password" -C \
              -Q "SELECT 1" >/dev/null 2>&1; then
              echo "MSSQL is ready!"
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "MSSQL never became ready within the timeout" >&2
            docker compose logs mssql || true
            exit 1
          fi

      - name: SQL regression + E2E matrix + SLO + prod gate
        run: make check-e2e

      - name: Tear down SQL Server
        if: always()
        run: docker compose down -v
