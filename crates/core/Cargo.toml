[package]
name = "migrator-core"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono", "native-tls"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }

[features]
default = []
session-daemon = []

[dev-dependencies]
tempfile = "3.27"
migrator-core-dev = { path = "../core-dev" }
proptest = "1.11.0"
