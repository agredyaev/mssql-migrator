[package]
name = "migrator-core-dev"
version.workspace = true
edition.workspace = true
build = "build.rs"
description = "Benches, footprint baselines, and profilers for migrator-core (not linked in production binaries)."
publish = false

[dependencies]
migrator-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph"] }

[dev-dependencies]
dhat = "0.3.3"

[features]
default = []
bench-skip = []
bench-transitions = []
bench-scan = []

[[bench]]
name = "plan_diff"
harness = false
required-features = ["bench-skip"]

[[bench]]
name = "plan_diff_load"
harness = false
required-features = ["bench-skip"]

[[bench]]
name = "plan_diff_load_transitions"
harness = false
required-features = ["bench-transitions"]

[[bench]]
name = "plan_diff_dhat"
harness = false
required-features = ["bench-skip"]

[[bench]]
name = "plan_diff_dhat_transitions"
harness = false
required-features = ["bench-transitions"]

[[bench]]
name = "plan_diff_dhat_scan"
harness = false
required-features = ["bench-scan"]

[[bench]]
name = "scan_load"
harness = false
required-features = ["bench-scan"]

[[bench]]
name = "scan_dhat"
harness = false
required-features = ["bench-scan"]

[[bench]]
name = "cache_serde_load"
harness = false
required-features = ["bench-skip"]

[[bench]]
name = "cache_serde_dhat"
harness = false
required-features = ["bench-skip"]

[[bench]]
name = "scan_digest"
harness = false
