[package]
name = "rmig"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rmig"
path = "src/main.rs"

[dependencies]
migrator-core = { path = "../core" }
serde_json = "1"
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
session-daemon = ["migrator-core/session-daemon"]

[dev-dependencies]
tempfile = "3.27"
