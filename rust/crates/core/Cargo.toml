[package]
name = "migrator-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono", "native-tls"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[features]
default = []
session-daemon = []

[dev-dependencies]
tempfile = "3.27"
serde_json = "1"
criterion = { workspace = true }
pprof = { workspace = true }
dhat = "0.3.3"
tracing-subscriber = { workspace = true }

[[bench]]
name = "scan_digest"
harness = false

[[bench]]
name = "plan_diff"
harness = false

[[bench]]
name = "plan_diff_dhat"
harness = false

[[bench]]
name = "plan_diff_dhat_transitions"
harness = false

[[bench]]
name = "plan_diff_dhat_scan"
harness = false
